[package]
name = "capy"
version.workspace = true
edition.workspace = true

[lib]
name = "capy"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cc = "1"

[dependencies]
atomic.workspace = true
bitflags.workspace = true
bytemuck.workspace = true
capstone.workspace = true
env_logger.workspace = true
libm.workspace = true
num-bigint = { workspace = true, optional = true }
num = { workspace = true }
object = { version = "0.37.3", default-features = false, features = [
    "read",
    "write",
] }
onlineasm = { git = "https://codeberg.org/playxe/offlineasm", rev = "e25e0b92148b76db78f22cc043a3f3aff1cd21d6" }
rand.workspace = true
mmtk.workspace = true
simplehash.workspace = true
tree-sitter = { workspace = true, optional = true }
tree-sitter-scheme = { workspace = true, optional = true }
rustix = { version = "*", features = ["fs", "pipe", "event"] }
paste.workspace = true
pretty.workspace = true
petgraph.workspace = true
libc.workspace = true
log.workspace = true
backtrace.workspace = true
libffi.workspace = true
unicode-general-category.workspace = true
unicode-normalization.workspace = true
uuid = { version = "1.18.1", features = ["v4"] }
hostname = "0.4.1"
errno = "0.3.14"
parking_lot = "0.12.5"
icu = { version = "2.0.0", features = ["compiled_data"] }
sys-locale = "0.3.2"
capy-derive.workspace = true
bytecodegen = "0.2.0"
cranelift-entity = "0.134.2"
polling = "3.11.0"
smallvec = "1.15.1"
flate2 = "1.1.9"

[dependencies.im]
version = "15.1.0"
package = "im-rc"

[features]
default = ["portable", "bootstrap"]
portable = []
aslr = []
bootstrap = ["tree-sitter", "tree-sitter-scheme", "num-bigint"]
