[package]
name = "capy-cli"
version.workspace = true
edition.workspace = true
description = "Thin CapyScheme runtime executable (capy-rt) over libcapy SNI"

[[bin]]
name = "capy-rt"
path = "src/main.rs"

[dependencies]
capy-sni = { path = "../capy-sni" }

[target.'cfg(target_os = "macos")'.dependencies]
libsui = "0.16.4"
