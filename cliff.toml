# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# History is a mix of conventional (`feat: ...`) and free-form subjects, so
# unconventional commits are kept and grouped under "Other" rather than dropped.

[changelog]
header = """
# Changelog

All notable changes to CapyScheme are documented here.
This file is generated by [git-cliff](https://git-cliff.org); do not edit it by hand.\n
"""
body = """
{%- macro entry(commit) -%}
  - {% if commit.scope %}**{{ commit.scope }}:** {% endif -%}
    {% if commit.breaking %}**BREAKING** {% endif -%}
    {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- endmacro -%}
{%- macro remote_url() -%}
  https://github.com/playX18/capyscheme
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
commit_preprocessors = [
  # Collapse "(#123)" PR suffixes into nothing; the commit link is enough.
  { pattern = '\s*\(#\d+\)$', replace = "" },
]
commit_parsers = [
  # Housekeeping that is noise in a user-facing changelog.
  { message = "^(chore|ci)(\\(.+\\))?: (release|bump|update changelog)", skip = true },
  { message = "(?i)changelog|git-cliff|cliff\\.toml", skip = true },
  { message = "^Merge ", skip = true },

  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactoring" },
  { message = "^doc", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->🏗️ Build & CI" },
  { message = "^(chore|style)", group = "<!-- 7 -->🧹 Chores" },
  # Free-form subjects without a conventional prefix.
  { message = ".*", group = "<!-- 8 -->📦 Other" },
]
