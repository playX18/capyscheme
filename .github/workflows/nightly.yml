# Nightly prerelease: built every 24h, but only if the default branch has new
# commits since the previous nightly. The `nightly` release/tag is replaced
# on every run.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed since the last nightly"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.diff.outputs.sha }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          sha="$GITHUB_SHA"
          last=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/tags/nightly^{}" "refs/tags/nightly" | awk 'END{print $1}')
          echo "HEAD=$sha last nightly=${last:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ] || [ "$last" != "$sha" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes since last nightly; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      label: nightly
      upload: true
      ref: ${{ needs.check.outputs.sha }}

  publish:
    name: Publish nightly
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: capyscheme-*
          merge-multiple: true

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          ls -l assets
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Automated nightly build of \`${SHA:0:12}\`. Not a stable release."
