# Nightly prerelease: built every 24h, but only if the default branch has new
# commits since the previous nightly. The `nightly` release/tag is replaced
# on every run.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed since the last nightly"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.diff.outputs.sha }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          sha="$GITHUB_SHA"
          last=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/tags/nightly^{}" "refs/tags/nightly" | awk 'END{print $1}')
          echo "HEAD=$sha last nightly=${last:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ] || [ "$last" != "$sha" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes since last nightly; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      label: nightly
      upload: true
      ref: ${{ needs.check.outputs.sha }}

  publish:
    name: Publish nightly
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0

      # Everything since the last stable vX.Y.Z tag 
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: capyscheme-*
          merge-multiple: true

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          ls -l assets
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == "nightly") | .id' || true)
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" || true
          gh release create nightly assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "$(printf 'Automated nightly build of `%s`. Not a stable release.\n\n## Changes since the last release\n\n%s\n' "${SHA:0:12}" "$(cat RELEASE_NOTES.md)")"
          gh release edit nightly --repo "$GITHUB_REPOSITORY" --draft=false

  tap:
    name: Update Homebrew tap
    needs: [check, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: capyscheme-*
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          repository: playX18/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Generate formula
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          scripts/gen-formula.sh nightly "$cargo_version-nightly.$(date -u +%Y%m%d)" assets > tap/Formula/capyscheme-nightly.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "capyscheme-nightly ${GITHUB_SHA:0:12}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
