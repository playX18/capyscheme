# CD: pushing a tag like v3.0.0 builds, tests and publishes a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          case "$tag" in
            "$cargo_version"|"$cargo_version"-*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"; exit 1 ;;
          esac
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      label: ${{ needs.verify.outputs.version }}
      upload: true

  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: capyscheme-*
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd assets
          cat *.sha256 > SHA256SUMS
          rm -- *.sha256
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flag=""
          [ "$PRERELEASE" = "true" ] && flag="--prerelease"
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CapyScheme $GITHUB_REF_NAME" \
            --generate-notes $flag

  tap:
    name: Update Homebrew tap
    needs: [verify, publish]
    if: needs.verify.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: capyscheme-*
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          repository: playX18/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Generate formula
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          scripts/gen-formula.sh stable "$VERSION" assets > tap/Formula/capyscheme.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "capyscheme $VERSION"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
