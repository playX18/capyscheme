[workspace]
resolver = "3"
members = [
    "crates/capy",
    "crates/capy-derive",
    "crates/capy-sni-sys",
    "crates/capy-sni",
    "crates/capy-sni-derive",
    "crates/capy-cli",
    "crates/capy-cparse",
    "crates/capy-cparse-sni",
]

exclude = ["vendor"]

default-members = ["crates/capy", "crates/capy-cli"]

[workspace.package]
edition = "2024"
version = "3.0.2"

[workspace.dependencies]
mmtk = { git = "https://github.com/mmtk/mmtk-core", default-features = false }
libc = "0.2.174"
atomic = "0.6.1"
bitflags = "2.10.0"
bytemuck = "1.10.2"
capstone = "0.14.0"
env_logger = "0.11.8"
libm = "0.2.15"
num-bigint = "0.4.6"
rand = "0.9.2"
simplehash = "0.1.3"
num = "0.4.3"
tree-sitter = "0.25.5"
tree-sitter-scheme = { git = "https://github.com/6cdh/tree-sitter-scheme", rev = "45c72463ac4260ef6e07d1c0642ed43d4e9957b4" }
paste = "1.0.15"
pretty = "0.12.4"
petgraph = "0.8.2"
log = "0.4.27"
backtrace = "0.3.75"
libffi = { version = "5.0.0" }
tinyvec = "1.6.0"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
capy-derive = { path = "crates/capy-derive" }
serde = { version = "1.0.228", features = ["derive"] }

[profile.release]
incremental = true
rpath = true
debug = false
debug-assertions = false
lto = false
panic = "abort"
opt-level = 2

[profile.dev]
incremental = true
opt-level = 0
rpath = true
