[target.x86_64-apple-darwin]
rustflags = ["-Clink-args=-Wl,-rpath,@loader_path/", "-Clink-arg=-Wl,-rpath,@loader_path/../lib"]
[target.aarch64-apple-darwin]
rustflags = ["-Clink-args=-Wl,-rpath,@loader_path/", "-Clink-arg=-Wl,-rpath,@loader_path/../lib"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-Clink-args=-Wl,-rpath,$ORIGIN/", "-Clink-arg=-Wl,-rpath,$ORIGIN/../lib"]
[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-args=-Wl,-rpath,$ORIGIN/", "-Clink-arg=-Wl,-rpath,$ORIGIN/../lib", "-Clink-arg=-Wl,--no-rosegment"]
[target.i686-unknown-linux-gnu]
rustflags = ["-Clink-args=-Wl,-rpath,$ORIGIN/", "-Clink-arg=-Wl,-rpath,$ORIGIN/../lib"]
[target.armv7-unknown-linux-gnueabihf]
rustflags = ["-Clink-args=-Wl,-rpath,$ORIGIN/", "-Clink-arg=-Wl,-rpath,$ORIGIN/../lib"]
[target.aarch64-unknown-linux-musl]
rustflags = ["-Clink-args=-Wl,-rpath,$ORIGIN/", "-Clink-arg=-Wl,-rpath,$ORIGIN/../lib"]
[target.x86_64-unknown-linux-musl]
rustflags = ["-Clink-args=-Wl,-rpath,$ORIGIN/", "-Clink-arg=-Wl,-rpath,$ORIGIN/../lib"]
[target.i686-unknown-linux-musl]
rustflags = ["-Clink-args=-Wl,-rpath,$ORIGIN/", "-Clink-arg=-Wl,-rpath,$ORIGIN/../lib"]
[target.armv7-unknown-linux-musleabihf]
rustflags = ["-Clink-args=-Wl,-rpath,$ORIGIN/", "-Clink-arg=-Wl,-rpath,$ORIGIN/../lib"]
